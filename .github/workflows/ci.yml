name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    strategy:
      matrix:
        # Project is Linux/Ubuntu only (see README / CLAUDE.md).
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev,ui,cirq]

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  required-pr-ci:
    name: ${{ github.event_name == 'pull_request' && 'required-pr-ci' || 'push-ci-summary' }}
    if: ${{ always() }}
    needs:
      - lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate required jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          LINT_AND_TEST_RESULT: ${{ needs['lint-and-test'].result }}
        run: |
          set -euo pipefail

          if [[ "${LINT_AND_TEST_RESULT}" != "success" ]]; then
            echo "Required job lint-and-test finished with '${LINT_AND_TEST_RESULT}', expected success."
            exit 1
          fi

          echo "All required jobs passed."
